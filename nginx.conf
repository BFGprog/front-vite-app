server {
  listen 9002;

  location /api/thread/ {
    rewrite ^/api/thread/(.*)$ /$1 break;
    proxy_pass http://thread:9003/;
  }

  location /api/cable/ {
    client_max_body_size 10M;
    rewrite ^/api/cable/(.*)$ /$1 break;
    proxy_pass http://cable:9004/;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri /index.html;
  }
}